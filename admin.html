<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beheer - De Gouden Stap</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">GS</span><span><strong data-site-name>De Gouden Stap</strong><small>BEHEER</small></span></a><nav class="menu"><a href="index.html">Website</a><a class="active" href="admin.html">Beheer</a></nav></div></header><main class="container admin"><div class="notice">Stel eerst Supabase in volgens README.txt. Log daarna hieronder in met het beheerdersaccount dat je in Supabase hebt aangemaakt. Zonder online configuratie blijven wijzigingen alleen in deze browser.</div><section class="panel" style="margin-bottom:20px"><h2>Beheerlogin</h2><div class="admin-grid"><div><label>E-mailadres</label><input id="admin-email" type="email" autocomplete="username" placeholder="beheer@jouwdomein.nl"></div><div><label>Wachtwoord</label><input id="admin-password" type="password" autocomplete="current-password" placeholder="Wachtwoord"></div></div><p><button class="btn" onclick="login()">Inloggen</button> <button class="btn" style="background:#777" onclick="logout()">Uitloggen</button></p><div id="auth-status" class="small"></div></section><div id="save-status" class="small" role="status"></div><div id="app"></div></main><div class="savebar"><button class="btn" onclick="save()">Opslaan</button> <button class="btn" style="background:#777" onclick="resetData()">Terug naar standaard</button></div><footer data-footer></footer><script src="supabase-config.js"></script><script src="app.js"></script><script>
let d;
async function init(){d=await loadData();applySite(d);render()}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function input(label,path,value,multi=false,type='text',placeholder=''){return `<label>${label}</label>${multi?`<textarea data-path="${path}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input type="${type}" data-path="${path}" value="${esc(value)}" placeholder="${esc(placeholder)}">`}`}
function render(){
 const cards=d.home.cards||[];
 app.innerHTML=`<div class="admin-grid"><section class="panel"><h2>Algemeen</h2>${input('Bedrijfsnaam','site.name',d.site.name)}${input('Tagline','site.tagline',d.site.tagline)}${input('Primaire kleur','site.primary',d.site.primary)}${input('Donkere kleur','site.dark',d.site.dark)}${input('Achtergrondkleur','site.cream',d.site.cream)}${input('Tekstkleur','site.text',d.site.text)}${input('Footer','site.footer',d.site.footer)}</section><section class="panel"><h2>Homepage</h2>${input('Kleine titel','home.eyebrow',d.home.eyebrow)}${input('Hoofdtitel','home.title',d.home.title)}${input('Cursieve titel','home.titleItalic',d.home.titleItalic)}${input('Intro','home.intro',d.home.intro,true)}${input('Hero-afbeelding URL','home.heroImage',d.home.heroImage,false,'url','https://...')}${input('Over titel','home.aboutTitle',d.home.aboutTitle)}${input('Over tekst','home.aboutText',d.home.aboutText,true)}${input('Over-afbeelding URL','home.aboutImage',d.home.aboutImage,false,'url','https://...')}${input('Detail titel','home.detailTitle',d.home.detailTitle)}${input('Detail tekst','home.detailText',d.home.detailText,true)}${input('CTA titel','home.ctaTitle',d.home.ctaTitle)}${input('CTA tekst','home.ctaText',d.home.ctaText,true)}</section></div>
 <section class="panel" style="margin-top:20px"><h2>Homepage-kaarten</h2><p class="small">Voeg per kaart een eigen website-URL toe. Laat leeg om naar de collectie te linken.</p><div class="admin-grid">${cards.map((c,i)=>`<div class="panel">${input('Titel',`home.cards.${i}.title`,c.title)}${input('Tekst',`home.cards.${i}.text`,c.text,true)}${input('Afbeelding URL',`home.cards.${i}.image`,c.image,false,'url','https://...')}${input('Klik-URL',`home.cards.${i}.url`,c.url||'',false,'url','https://...')}</div>`).join('')}</div></section>
 <section class="panel" style="margin-top:20px"><h2>Categorieën</h2><p class="small">Vul een afbeelding-URL en eventueel een eigen klik-URL in. Laat de klik-URL leeg om de collectie van die categorie te openen.</p><div class="admin-grid">${d.categories.map((c,i)=>`<div class="panel">${input('Naam',`categories.${i}.title`,c.title)}${input('Beschrijving',`categories.${i}.text`,c.text,true)}${input('Afbeelding URL',`categories.${i}.image`,c.image,false,'url','https://...')}${input('Klik-URL',`categories.${i}.url`,c.url||'',false,'url','https://...')}</div>`).join('')}</div></section>
 <section class="panel" style="margin-top:20px"><h2>Producten</h2><p class="small">Plaats hier bijvoorbeeld een productpagina, merkpagina of externe webshop-URL. De knop verschijnt bij het geselecteerde product.</p><div class="admin-grid">${d.products.map((x,i)=>`<div class="panel">${input('Productnaam',`products.${i}.name`,x.name)}${input('Categorie',`products.${i}.category`,x.category)}${input('Afbeelding URL',`products.${i}.image`,x.image,false,'url','https://...')}${input('Product-URL',`products.${i}.url`,x.url||'',false,'url','https://...')}</div>`).join('')}</div></section>`;
}
function setPath(obj,path,val){let parts=path.split('.'),o=obj;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts.at(-1)]=val}
async function login(){const status=document.getElementById('auth-status');try{const c=await getSupabaseClient();if(!c){status.textContent='Vul eerst supabase-config.js in.';return}const {error}=await c.auth.signInWithPassword({email:document.getElementById('admin-email').value,password:document.getElementById('admin-password').value});status.textContent=error?('Inloggen mislukt: '+error.message):'Ingelogd. Je kunt nu online opslaan.'}catch(e){status.textContent='Inloggen mislukt. Controleer Supabase-instellingen.'}}
async function logout(){const c=await getSupabaseClient().catch(()=>null);if(c)await c.auth.signOut();document.getElementById('auth-status').textContent='Uitgelogd.'}
async function save(){document.querySelectorAll('[data-path]').forEach(e=>setPath(d,e.dataset.path,e.value.trim()));const status=document.getElementById('save-status');status.textContent='Bezig met opslaan…';try{const result=await saveData(d);status.textContent=result.cloud?'Online opgeslagen! Alle bezoekers zien de wijzigingen na vernieuwen.':result.loginRequired?'Alleen lokaal opgeslagen. Log in als beheerder om online op te slaan.':'Lokaal opgeslagen. Configureer Supabase en log in om wijzigingen met iedereen te delen.';render()}catch(e){status.textContent='Online opslaan mislukt: '+(e.message||'controleer Supabase en databasebeleid')+'. De lokale kopie is bewaard.'}}
init();
</script></body></html>
